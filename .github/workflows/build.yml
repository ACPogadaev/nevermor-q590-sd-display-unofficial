name: Windows build and self-test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with verified pinned official NuGet dependencies
        shell: powershell
        run: ./scripts/build.ps1
      - name: Self-test without USB writes
        shell: powershell
        run: ./scripts/test.ps1
      - name: Build offline combined installer without installing driver
        shell: powershell
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: NevermorDisplay-1.3.1-Setup
          path: dist/*
          if-no-files-found: error
